spring.application.name=easyrideApp

spring.datasource.url=jdbc:postgresql://localhost:5432/easyride
spring.datasource.username=sibasundarj8
spring.datasource.password=Jena@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# flyway related stuff
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# actuator related stuff
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
management.info.git.enabled=true
info.app.name=easyride
info.app.version=1.0.0
info.app.description=Ride booking platform, in which you can book a ride and driver will drop you there
info.app.owner=Sibasundar Jena
